# Supported upstream julia versions. Julia ships OFFICIAL per-platform
# prebuilt binaries (julialang.org), so this factory is a REPACK (the
# template's §1 repack arm — no compilation anywhere): THIS file is the
# source-pin trust anchor, keyed per version and per spec 03 §3 triplet,
# the sha256 recorded beside each url, verified at fetch time (a mismatch
# is a hard error, never a refetch). The pins are upstream's own published
# values — cross-checked against https://julialang-s3.julialang.org/bin/
# versions.json on 2026-11-23 (1.13.4 is the current stable).
#
# contract.yml's julia.catalog selects which of these pinned versions the
# matrix builds; scripts/check_contract.rb locks the two (a catalog
# version with no pin, or a pin the catalog never builds, is a config
# bug). A new triplet's increment adds its sources entry here in the same
# PR as the matrix row.
---
versions:
  "1.13.4":
    line: "1.13"
    sources:
      x86_64-linux-gnu:
        url: https://julialang-s3.julialang.org/bin/linux/x64/1.13/julia-1.13.4-linux-x86_64.tar.gz
        sha256: cf1658f13b91facccd57d41464d7125a0e48a1d24f49062d71532d04d4ec4130
