# Bootstrap <-> runtime contract version: the versioned protocol between
# the tebako bootstrap (released from tamatebako/tebako) and the runtime
# images published from this repo — the env vars passed down, the argv
# layout, and the filesystem-image handoff. This factory has NO contract-1
# era: julia runtimes exist only in the image era, so contract_version is
# 2 from the first build (the schema floors it at 2 — contract 1 was the
# retired v1 C++ tebako-main.cpp grammar this factory never ships). Bump
# rules mirror the other factories': any change to env/argv/handoff
# semantics bumps the integer by exactly +1, here and in the consumed
# driver's compiled-in TEBAKO_CONTRACT_VERSION, in the same commit —
# scripts/check_contract.rb locks the two (the driver-source parity arm
# reads the pinned link_unit_release's crates/tebako-driver/src/lib.rs).
#
# Schema: schema/contract.schema.yml (validated by the same check).
---
contract_version: 2

# The toolchain CONTAINER line the POSIX legs run inside:
# ghcr.io/tamatebako/tpkg-builder-<triplet>:<container_version>, baked by
# tebako-ci-containers. This factory never references the archived v1
# tebako-<platform> images. "v1" is the moving family tag; the immutable
# side is container_digests below. Nothing in this factory COMPILES (the
# repack arm — docs/factory-template.md §1): the container is the pinned,
# reproducible build/boot environment (the smoke proves the pair against
# the builder line's glibc, never the rolling runner image's).
container_version: "v1"

# The immutable side of the container line (the ruby#381 idiom, born
# pinned here): the ghcr manifest digest per (container x arch), recorded
# at pin time. ghcr tags are MUTABLE, so container_version alone never
# pins the toolchain — the preflight job proves recorded == live (the
# registry's Docker-Content-Digest header) before any leg spends compute,
# and the container legs pull name:tag@digest. A deliberate toolchain
# bump edits the tag above AND the digests here in the same commit. Read
# the live digest with ghcr's anonymous-token flow:
#   token=$(curl -fsSL "https://ghcr.io/token?scope=repository:tamatebako/tpkg-builder-<triplet>:pull" | jq -r .token)
#   curl -fsSL -o /dev/null -D - -H "Authorization: Bearer $token" \
#     -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
#     "https://ghcr.io/v2/tamatebako/tpkg-builder-<triplet>/manifests/<tag>" | grep -i docker-content-digest
container_digests:
  tpkg-builder-x86_64-linux-gnu:
    amd64: "sha256:76d9822a4cdeb63d1b4081161c76a511ac50ecf40efd7c9820fe18c07225193d"

# The published link-unit pin: the tamatebako/tebako release whose
# prebuilt assets the legs CONSUME as downloads instead of building from
# source. The repack arm's consumption set (docs/factory-template.md §2.2):
#   - link-unit-<ver>-<pid>.tar.gz  (for libtfs_preload.so — staged into
#     the env image so the jail's host-IO binding survives the exec into
#     the interpreter; verified against the release API's per-asset
#     digest field, which the release SHA256SUMS does NOT cover)
#   - tebako-runtime-launcher-<ver>-<pid>  (the pair's EXE artifact —
#     the spec-29 wrapper; verified against its published .sha256 sidecar)
#   - tfs-<ver>-<pid>  (packs the env image + the smoke's fixtures;
#     verified against its published .sha256 sidecar)
# An empty pin, a missing asset, or a checksum MISMATCH are all hard named
# errors — never a silent fallback (this factory has no source-build path
# for the driver stack; a supply-chain event is reported, not worked
# around). v2.8.83 is the newest published release (verified 2026-11-23:
# the release ships link-unit + launcher + tfs assets for
# linux-gnu-x86_64); contract 2. The pin also floors the manifest MODEL
# the mkimage re-serialization carries: identity.era (the spec-18 field
# this factory's manifests emit) entered the tpkg model at v2.8.69 — an
# older pin would silently drop it from the packed image.
link_unit_release: "v2.8.83"

# The release machinery pin: tamatebako/tebako-release-tooling is the
# single owner of the publish/sign/audit machinery (ecosystem invariant
# 10); the Gemfile reads THIS value (one contract edit bumps the pin,
# never a second hand-written copy). The factory's identity + policy ride
# scripts/release_adapter.rb — the repo carries no copy of the machinery.
# v0.5.3 is the current tag: the windows completeness gate consults the
# adapter's dll_install_name declaration, so an exec-cache runtime (the
# openjdk shape — this factory) is no longer demanded a .dll facet it
# never publishes (the first v0.1.0 publish, run 45169138993, died on
# the unconditional expectation).
release_tooling: "v0.5.3"

# The julia version catalog this factory builds (and will publish, once
# the publish increment lands). The SOURCE PINS (url/sha256 per version
# per triplet) live in versions.yml — julia ships official per-platform
# prebuilt binaries, so this factory fetches julialang.org's published
# archives directly (the repack arm); check_contract locks catalog <=>
# versions.yml (a version in one but not the other is a config bug).
#
# Set grammar (the sibling factories' semantics):
#   catalog — every version this factory builds
#   full    — the tip of every supported line
#   tidy    — the primary smoke set
julia:
  catalog: ["1.13.4"]
  full: ["1.13.4"]
  tidy: ["1.13.4"]
