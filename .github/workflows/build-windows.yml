# The windows trigger — deliberately thin (tebako-runtime-php's grammar).
# Every event hands the dispatch filters to _build-platform.yml, whose
# compute stage expands THIS platform's legs.

name: build-windows

on:
  push:
    branches: [main]
    # A docs-only change cannot change a build's outcome (tebako#866).
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:
    inputs:
      julia_filter:
        description: 'julias: "full", "tidy", "catalog", or comma-separated versions'
        type: string
        default: 'full'
      arch_filter:
        description: 'Arch slice: "all" or an arch (x86_64 | arm64)'
        type: string
        default: 'all'

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/_build-platform.yml
    # Spec 34 §3/§8.2: the called workflow's build job declares
    # id-token:write (the windows-signing OIDC boundary) — a reusable
    # workflow can never elevate past the caller's grant, so the grant
    # flows from here. contents/attestations restate the called
    # workflow's existing needs (a permissions block is the complete set,
    # not an addition — the publish job's SLSA L3 arm).
    permissions:
      contents: write
      attestations: write
      id-token: write
    with:
      platform: windows
      julia_filter: ${{ inputs.julia_filter || 'full' }}
      arch_filter: ${{ inputs.arch_filter || 'all' }}
    secrets: inherit
