# The ONE per-platform build workflow (tebako-runtime-php's
# _build-platform.yml port, at this factory's scope — the repack arm:
# nothing compiles here; the legs are one containerized linux-gnu x86_64
# leg plus the runner-native macos arm64/x86_64 and windows x64 legs; no
# musl legs — upstream ships no musl julia ≥ 1.11). Called by the thin
# platform triggers (build-<platform>.yml) and by the publish.yml
# coordinator — never dispatched directly.
#
# Stage 0 (parity): the contract gate's driver-source parity arm needs the
#   pinned link-unit release's lib.rs — a raw.githubusercontent.com fetch
#   that flakes under near-simultaneous per-platform reads
#   (tamatebako/tebako-runtime-python#4). ONE dedicated job fetches it
#   (bounded retry inside BuildHelpers.read_url) and hands it to the
#   compute job as an artifact, so a flaky fetch fails this one retried
#   job instead of a platform's whole compute leg.
# Stage 1 (compute): the contract gate (schema + pins + the parity arm,
#   reading the stage-0 artifact via TEBAKO_DRIVER_SRC — fail-closed
#   exactly as before) runs, then scripts/compute_matrix.rb expands THIS
#   platform's legs under the dispatch filters. Every downstream value
#   flows from these outputs — workflow YAML never hardcodes a version, a
#   tag, or a SHA (ecosystem SSOT invariant). The run's SOURCE_DATE_EPOCH
#   (the HEAD commit's epoch, ruby#381's idiom) is computed here too, so
#   every leg stamps the SAME build timestamp into the image manifest.
# Stage 2 (preflight): the container digest pins (ruby#381's idiom, born
#   pinned here): contract.yml's container_digests must match the
#   registry's CURRENT digest for the tag — per (container x leg arch) —
#   before any leg spends compute; the legs then pull name:tag@digest, so
#   the toolchain container can never move under the matrix.
# Stage 3 (build): one leg per (julia x arch) of this platform:
#   tools/build_runtime -> the macOS sign+notarize arm (spec 31, gated on
#   APPLE_SIGNING_ENABLED — the sign step rewrites the exe .sha256
#   sidecar to the SIGNED bytes, sign-then-hash) -> the windows
#   Authenticode arm (spec 34 §8.2, gated on WINDOWS_SIGNING_ENABLED —
#   the verify step moves the signed bytes back over the contract path
#   and re-anchors the exe .sha256 sidecar, sign-then-hash) ->
#   ci/check_pair_provenance.sh -> tools/boot_smoke -> the
#   runtime-packages-<os>-<arch>-<julia> artifact. The build fetches and
#   sha256-verifies every input itself (the pinned julia prebuilt archive
#   off versions.yml, the pinned link unit (POSIX) + launcher + tfs CLI
#   off the product release) — there is NO source-build path for the
#   driver stack here (contract.yml's link_unit_release comment), so the
#   ruby factory's whole link-unit staging job has no counterpart.
# Stage 4 (publish + sign): the publish job — one leg per (julia x arch),
#   re-running THIS leg's artifact handoff. The leg that built a package
#   publishes it (the tebako-release gem's uploader) and signs its served
#   names (the gem's signer) — spec 13 §2a's de-rendezvous
#   (tebako-runtime-ruby#161's pattern): write-once per-leg names, no
#   shared release-asset mutation, so N legs publish concurrently with
#   zero rendezvous and one failed leg no longer blocks the green legs'
#   packages. The publish job is a SEPARATE job from the build
#   (tebako-runtime-ruby#190): GitHub's re-run granularity is the job, so
#   a publish-layer failure re-runs as a minutes-long download + upload,
#   never a rebuild. The coordinator (publish.yml) keeps ONE release job:
#   the read-only audit of the whole matrix against the release.
#
# Container grammar (the php factory's): the linux legs run on the ubuntu
# host and docker-run the tpkg-builder image per step. The macos legs are
# runner-native (nothing to provision beyond ruby — the repack arm
# compiles nothing, so the toolchain is the runner's own). The windows
# leg is runner-native under Git-bash with the runner's hosted ruby (the
# openjdk factory's idiom): julia ships tar.gz with zero symlinks (Git-
# bash's GNU tar suffices — the openjdk msys2 need was bsdtar-for-zip +
# the gcc runtime, neither of which this leg touches), and the driver/
# launcher/tfs artifacts are native static exes.
#
# The cache holds ONLY the sha256-verified downloads (.build/downloads)
# and the staged link unit (.build/link-unit): a restored entry re-verifies
# against the pins on use, so a poisoned or stale cache cannot survive a
# pin bump (the key also carries the pins' hashes). save-always: a red
# boot smoke must never tax the next leg a cold re-download (the ruby
# factory's msys campaign lesson). CACHE_VER stays the manual escape
# hatch.
name: _build-platform

on:
  workflow_call:
    inputs:
      platform:
        description: 'This call''s platform: linux-gnu | macos | windows'
        required: true
        type: string
      julia_filter:
        description: 'julias: "full", "tidy", "catalog", or comma-separated versions'
        type: string
        default: 'full'
      arch_filter:
        description: 'Arch slice: "all" or an arch (x86_64 | arm64)'
        type: string
        default: 'all'
      audit:
        description: 'Audit only: compute the legs, build nothing (publish.yml''s audit mode)'
        type: boolean
        default: false
      publish:
        description: 'Publish each leg''s runtime package to the release and sign its served names (spec 13 §2a / spec 09 §5)'
        type: boolean
        default: false
    outputs:
      run:
        description: '"true" when this platform has legs under the filters (set in audit mode too — the audit reads the expectations)'
        value: ${{ jobs.compute.outputs.run }}
      tebako_version:
        description: 'The runtime package version (the VERSION file)'
        value: ${{ jobs.compute.outputs.tebako_version }}
      env_matrix:
        description: 'The selected matrix.json rows (+ host_id) as JSON — the release job''s EXPECTED_ENV_MATRIX'
        value: ${{ jobs.compute.outputs.env_matrix }}
      julia_matrix:
        description: 'The selected julia versions as JSON — the release job''s EXPECTED_JULIA_MATRIX'
        value: ${{ jobs.compute.outputs.julia_matrix }}

env:
  CACHE_VER: 1

jobs:
  # The parity artifact, fetched ONCE per call: the driver-source parity
  # arm's second representation (the pinned link-unit release's lib.rs)
  # off raw.githubusercontent.com — a transient-failure surface that used
  # to ride inside every platform's compute step, where one flake red-ed
  # the whole platform and the ::error:: never reached the log
  # (tamatebako/tebako-runtime-python#4). The fetch retries with backoff
  # (BuildHelpers.read_url) and names every failed attempt on stderr; the
  # compute job below consumes the artifact, never the network.
  parity:
    name: Fetch the driver parity source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Fetch the pinned driver's parity source
        run: bundle exec scripts/check_contract.rb --fetch-parity .build/parity/lib.rs

      # Artifact names are per workflow RUN: publish.yml calls this
      # workflow once per platform inside one run, so the platform suffix
      # keeps the three calls' artifacts distinct.
      - name: Upload the parity source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: driver-parity-src-${{ inputs.platform }}
          path: .build/parity/lib.rs
          retention-days: 1

  compute:
    name: Compute the ${{ inputs.platform }} legs
    needs: parity
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.emit.outputs.run }}
      leg_count: ${{ steps.emit.outputs.leg_count }}
      legs: ${{ steps.emit.outputs.legs }}
      tebako_version: ${{ steps.emit.outputs.tebako_version }}
      env_matrix: ${{ steps.emit.outputs.env_matrix }}
      julia_matrix: ${{ steps.emit.outputs.julia_matrix }}
      container_version: ${{ steps.emit.outputs.container_version }}
      container_digests: ${{ steps.emit.outputs.container_digests }}
      source_date_epoch: ${{ steps.get-sde.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The source-date epoch below reads the HEAD commit's own time
          # (git log -1 --format=%ct) — full history, never the depth-1
          # default (ruby#381's idiom).
          fetch-depth: 0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The parity artifact the stage-0 job fetched — the gate's parity
      # arm reads THIS file (TEBAKO_DRIVER_SRC), never the network.
      - name: Download the parity source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: driver-parity-src-${{ inputs.platform }}
          path: .build/parity

      # The contract gate first: contract.yml against its schema, the
      # catalog resolvable AND cross-locked to versions.yml's source pins,
      # AND the driver-source parity arm (the pinned link-unit release's
      # TEBAKO_CONTRACT_VERSION vs contract_version) — fail-closed, now
      # against the fetched artifact (a missing/unreadable file fails the
      # arm exactly like a failed fetch did).
      - name: validate the contract
        env:
          TEBAKO_DRIVER_SRC: .build/parity/lib.rs
        run: bundle exec scripts/check_contract.rb

      - id: emit
        env:
          JULIA_FILTER: ${{ inputs.julia_filter }}
          PLATFORM_FILTER: ${{ inputs.platform }}
          ARCH_FILTER: ${{ inputs.arch_filter }}
        run: |
          set -euo pipefail
          legs=$(scripts/compute_matrix.rb)
          count=$(jq '.include | length' <<< "$legs")
          {
            echo "legs=$legs"
            echo "leg_count=$count"
            if [ "$count" -gt 0 ]; then echo "run=true"; else echo "run=false"; fi
            echo "tebako_version=$(cat VERSION)"
            echo "container_version=$(scripts/versions --pin container_version)"
            echo "container_digests=$(ruby -ryaml -rjson -e '
              d = YAML.load_file("contract.yml")["container_digests"]
              abort("contract.yml declares no container_digests") if d.nil? || d.empty?
              print JSON.generate(d)
            ')"
            echo "env_matrix=$(scripts/compute_matrix.rb --format env)"
            echo "julia_matrix=$(scripts/compute_matrix.rb --format julias)"
          } >> "$GITHUB_OUTPUT"
          # Mirror the plan to the LOG: values written only to
          # $GITHUB_OUTPUT leave no diagnosable record when the legs skip.
          echo "plan (${{ inputs.platform }}): $count legs (julia=${JULIA_FILTER} arch=${ARCH_FILTER})"
          jq -r '.include[] | "  \(.julia) \(.os)/\(.arch) on \(.host)"' <<< "$legs"

      # The run's build timestamp: ONE value for the whole run — the HEAD
      # commit time — so every leg stamps the SAME SOURCE_DATE_EPOCH into
      # the image manifest's identity.created (ImageManifest honors it;
      # unset falls to epoch 0). The full-history checkout above makes %ct
      # the commit's own time, never the run's wall clock — a same-commit
      # re-run reproduces it (ruby#381's idiom).
      - name: Get the source-date epoch
        id: get-sde
        run: |
          sde=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH for this run: $sde"
          echo "epoch=$sde" >> "$GITHUB_OUTPUT"

  preflight:
    name: Verify the toolchain container digests
    needs: compute
    if: ${{ needs.compute.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify every referenced container manifest exists at its recorded digest
        env:
          LEGS: ${{ needs.compute.outputs.legs }}
          CONTAINER_VERSION: ${{ needs.compute.outputs.container_version }}
          CONTAINER_DIGESTS: ${{ needs.compute.outputs.container_digests }}
        run: |
          set -u
          # One record per (container x leg arch): the digest grammar keys
          # docker arch names (amd64/arm64), the legs key x86_64/arm64.
          pairs=$(printf '%s' "$LEGS" | jq -r '.include[] | select(.container != null) | .container + " " + .arch' | sed 's/:[^:]* / /' | sort -u)
          [ -n "$pairs" ] || { echo "no containerized legs; nothing to preflight"; exit 0; }
          missing=0
          while read -r ref arch; do
            [ -n "$ref" ] || continue
            c="${ref#ghcr.io/tamatebako/}"
            case "$arch" in
              x86_64) carch=amd64 ;;
              arm64)  carch=arm64 ;;
              *) echo "::error::unknown leg arch $arch"; missing=1; continue ;;
            esac
            recorded=$(printf '%s' "$CONTAINER_DIGESTS" | jq -r --arg c "$c" --arg a "$carch" '.[$c][$a] // empty')
            if [ -z "$recorded" ]; then
              echo "::error::contract.yml container_digests records no digest for $c/$carch — record the published digest there"
              missing=1
              continue
            fi
            # ghcr's anonymous-token flow (no docker login on this job):
            # the manifest GET's Docker-Content-Digest header is the
            # registry's CURRENT digest for the tag — a retagged image
            # (a toolchain move under an unchanged tag) shows here.
            token=$(curl -fsSL "https://ghcr.io/token?scope=repository:tamatebako/${c}:pull" | jq -r .token) || token=
            live=$(curl -fsSL -o /dev/null -D - \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://ghcr.io/v2/tamatebako/${c}/manifests/${CONTAINER_VERSION}" \
              | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p') || live=
            if [ -z "$live" ]; then
              echo "::error::missing toolchain container: ${ref}:${CONTAINER_VERSION}"
              missing=1
            elif [ "$live" != "$recorded" ]; then
              echo "::error::${ref}:${CONTAINER_VERSION} moved: recorded $recorded, live $live — a retagged toolchain container under an unchanged tag; repin contract.yml container_digests only as a reviewed toolchain bump"
              missing=1
            else
              echo "ok: ${ref}:${CONTAINER_VERSION} @ $live"
            fi
          done <<< "$pairs"
          [ "$missing" -eq 0 ] || { echo "::error::preflight failed — publish the containers or fix container_version/container_digests in contract.yml"; exit 1; }

  build:
    name: ${{ matrix.julia }} / ${{ matrix.os }}-${{ matrix.arch }}
    needs: [compute, preflight]
    # An unguarded empty matrix poisons the run conclusion; an audit run
    # builds nothing (publish.yml's audit mode verifies the RELEASE). No
    # always() here: a FAILED preflight (a moved toolchain container)
    # must skip the legs outright — the verify job reports it by name.
    if: ${{ needs.compute.outputs.run == 'true' && !inputs.audit }}
    runs-on: ${{ matrix.host }}
    # A hung leg fails loudly at the cap, never silently (the ruby
    # factory's 150-minute record is the reference).
    timeout-minutes: 150
    # Spec 34 §3/§8.2 (the ruby factory's windows-signing lane, mirrored
    # through tebako-runtime-python#107's): a job-level permissions block
    # REPLACES the inherited set, so this is the complete grant —
    # contents:read (the release-API digest fetches below) plus
    # id-token:write, the OIDC boundary: the Entra federated credential
    # issues Azure tokens only to a job of this repo running in the
    # windows-signing environment. The signing steps below are gated on
    # WINDOWS_SIGNING_ENABLED: unsigned runs carry the environment but
    # never request a token. A reusable workflow can never ELEVATE past
    # the caller's grant, so every caller (the three build-<platform>.yml
    # triggers + publish.yml) declares the same superset.
    permissions:
      contents: read
      id-token: write
    # Spec 34's attestation boundary (see the id-token note above). The
    # build job is shared by every platform's legs — only windows legs
    # ever arm the signing chain, but ALL legs carry the environment:
    # it must NEVER gain required reviewers (that would gate every
    # platform's build on an approval); protection rules stay empty.
    environment: windows-signing
    # build_runtime's release-digest fetches ride the GitHub API;
    # unauthenticated calls share the runner NAT's 60/h budget and die on
    # 403 flakes (the python factory's 02 round-4 macos leg).
    # secrets.GITHUB_TOKEN raises the budget to 5000/h; the container leg
    # forwards it via -e below. SOURCE_DATE_EPOCH is the compute job's
    # run-wide value (ruby#381); the container leg forwards it too.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_DATE_EPOCH: ${{ needs.compute.outputs.source_date_epoch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute.outputs.legs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create folder for runtime packages
        # bash on every OS (Git-bash on windows) — the windows default
        # pwsh would read `-p` its own way.
        shell: bash
        run: mkdir -p runtime-packages

      - name: Cache the verified downloads + the staged link unit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/downloads
            .build/link-unit
          key: tebako-julia-dl-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('contract.yml', 'versions.yml') }}-v${{ env.CACHE_VER }}
          save-always: true

      # --- provisioning (the host-native macos legs only; the container
      # legs' toolchain is baked into the tpkg-builder image, and the
      # windows leg's hosted ruby + Git-bash suffice — the header) ------
      - name: Setup Ruby (the build tooling's interpreter)
        if: matrix.os == 'macos'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: false

      # --- build (the container legs docker-run the digest-pinned
      # tpkg-builder image per step — the preflight proved the pin) -------
      # --arch + --link-unit-pid are passed explicitly: the leg's DECLARED
      # coordinates beat the tooling process's self-report (under
      # emulation host_cpu can lie), and the product-asset platform id is
      # the planner's, never a re-derivation inside the container.
      - name: Build the runtime (container legs)
        if: matrix.container != null
        env:
          CONTAINER_DIGESTS: ${{ needs.compute.outputs.container_digests }}
        run: |
          set -euo pipefail
          c="${{ matrix.container }}"
          name="${c%:*}"
          case "${{ matrix.arch }}" in
            x86_64) carch=amd64 ;;
            arm64)  carch=arm64 ;;
            *) echo "::error::unknown leg arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          digest=$(printf '%s' "$CONTAINER_DIGESTS" | jq -r --arg c "${name#ghcr.io/tamatebako/}" --arg a "$carch" '.[$c][$a] // empty')
          [ -n "$digest" ] || { echo "::error::no recorded container digest for $name/$carch"; exit 1; }
          image="${c}@${digest}"
          echo "Building in $image"
          docker run --rm -e GITHUB_TOKEN -e SOURCE_DATE_EPOCH \
            -v "${{ github.workspace }}:/mnt/w" -w /mnt/w \
            "$image" bash -c '
              set -euo pipefail
              # tee opens .build/build.log BEFORE build_runtime creates
              # the tree: on a cold cache (first run, a pin bump) .build
              # does not exist yet, and GNU tee then defers exit 1 to
              # the end of a successful build (pipefail turns the green
              # leg red). Guarantee the directory first.
              mkdir -p .build
              tools/build_runtime --julia "${{ matrix.julia }}" --arch "${{ matrix.arch }}" \
                --link-unit-pid "${{ matrix.link_unit_pid }}" 2>&1 | tee .build/build.log
              # Root in the container writes root-owned files onto the
              # bind mount; hand them back to the runner user so the host
              # steps (cache save, artifact upload) can read/write them.
              uid=$(stat -c %u /mnt/w/contract.yml); gid=$(stat -c %g /mnt/w/contract.yml)
              chown -R "$uid:$gid" /mnt/w/.build /mnt/w/runtime-packages 2>/dev/null || true'

      - name: Build the runtime (macos)
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          mkdir -p .build
          tools/build_runtime --julia "${{ matrix.julia }}" --arch "${{ matrix.arch }}" \
            --link-unit-pid "${{ matrix.link_unit_pid }}" 2>&1 | tee .build/build.log

      # Git-bash + the runner's hosted ruby (the header): the tooling is
      # stdlib-only, and every artifact it executes (the launcher, the
      # tfs CLI) is a native static exe — no msys2 provisioning (julia
      # ships tar.gz, so Git-bash's GNU tar suffices).
      - name: Build the runtime (windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          tools/build_runtime --julia "${{ matrix.julia }}" --arch "${{ matrix.arch }}" \
            --link-unit-pid "${{ matrix.link_unit_pid }}" 2>&1 | tee .build/build.log

      # Spec 31 §5/§8.4: sign (Developer ID Application, hardened
      # runtime, the ci/runtime.entitlements pair) + notarize the macOS
      # runtime exe IN-LEG, before the provenance gate and the boot
      # smoke — every downstream gate, and the publish stage's .sha256
      # sidecar, anchors the exact SIGNED bytes (sign-then-hash is
      # mandatory; the sign step rewrites the sidecar itself). Gated on
      # the repo variable APPLE_SIGNING_ENABLED (unsigned stays
      # first-class without it — spec 00 invariant 7; armed + a missing
      # secret is a fast named failure).
      - name: Sign + notarize the runtime exe (macos, spec 31)
        if: matrix.os == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_ENABLED: ${{ vars.APPLE_SIGNING_ENABLED }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          runtime="tebako-runtime-${{ needs.compute.outputs.tebako_version }}-julia-${{ matrix.julia }}-${{ matrix.host_id }}"
          bash ci/macos-sign-notarize-runtime.sh "runtime-packages/$runtime"

      # Spec 34 §8.2 — the Windows Authenticode leg (the ruby factory's
      # lane, mirrored through tebako-runtime-python#107's): when the
      # repo variable WINDOWS_SIGNING_ENABLED=true, the leg's ONE
      # shippable PE — the launcher exe, shipped byte-identical from the
      # pinned product release (the repack arm; julia.exe + its DLLs
      # live INSIDE the .tfs env image — the exec-cache shape — so there
      # is NO DLL facet, scripts/release_adapter.rb's dll_install_name
      # default) — is Azure Trusted Signed here: after the build, before
      # the provenance gate and the boot smoke (which then exercise the
      # SIGNED bytes — the on-platform proof) and the upload. Signing
      # rides a sign-staging COPY, never the contract path directly: the
      # signing action enumerates by EXTENSION, so the exe stages under
      # sign-staging/ (the .tfs, the card, and the sidecars never enter
      # files-folder) and the verify step moves the signed bytes BACK
      # over the contract path before signtool-verifying it there
      # (signtool verifies content, not filename). Sign-then-hash (spec
      # 34 §1.3): the build emitted the exe's .sha256 sidecar over the
      # PRE-SIGN bytes, so the verify step re-anchors it to the SIGNED
      # bytes (the macOS arm's idiom) — the provenance gate's sidecar
      # arm and the publish stage then anchor exactly the shipped bytes.
      # Gate off: every step below skips and the leg ships unsigned,
      # byte-identically to today (spec 00 invariant 7 — §7.4 gate-off
      # parity).
      - name: Arm check — Windows signing (spec 34 §4)
        if: matrix.os == 'windows'
        id: signgate
        shell: bash
        env:
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERT_PROFILE: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
        run: bash ci/windows-sign-gate.sh

      # The sign-staging copy (the §7.3 soundness shape): the action
      # below enumerates by EXTENSION, so the exe stages under
      # sign-staging/ with its own name — the filter covers it by
      # construction. COPY, never move: the unsigned original keeps the
      # contract path until the verify step replaces it with the signed
      # bytes. A missing exe fails closed by name before any Azure
      # round-trip.
      - name: Stage the PE artifacts for signing (spec 34 §7.3)
        if: steps.signgate.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          runtime="tebako-runtime-${{ needs.compute.outputs.tebako_version }}-julia-${{ matrix.julia }}-${{ matrix.host_id }}"
          exe="runtime-packages/$runtime.exe"
          test -s "$exe" || { echo "::error::spec 34 §7.3: no runtime executable at $exe — nothing to sign"; exit 1; }
          mkdir -p sign-staging
          cp "$exe" "sign-staging/$runtime.exe"
          ls -l sign-staging/

      # OIDC workload-identity federation (spec 34 §3): no stored client
      # secret anywhere; the federated credential is scoped to this repo
      # × the windows-signing environment this job runs in.
      - name: Azure login (OIDC, spec 34 §8.2)
        if: steps.signgate.outputs.armed == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2 (sha-pinned; proven on the ruby factory's armed windows legs + tebako dry-run 34490242097)
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The action caches the TrustedSigning module at the CurrentUser
      # path (Documents\PowerShell\Modules\TrustedSigning\0.5.8) while its
      # own Install-Module lands AllUsers on the elevated runner — so a
      # cache hit restores a 23 KiB stub and the action SKIPS the install,
      # leaving Invoke-TrustedSigning unrecognized (the ruby factory's
      # 2026-09-21 incident: v18's x64 legs; v17 was green only because
      # its cache missed). Install to CurrentUser HERE, before the
      # action's cache step: the post-job save then captures a real
      # module, and even a poisoned restore can only overlay — never
      # delete — these bytes.
      - name: Preflight the TrustedSigning module (spec 34 §8.2)
        if: steps.signgate.outputs.armed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # PSGallery must be REGISTERED before Install-Module can name it:
          # the ruby factory's v0.17.6 3.2.11/x86_64 leg (run 42691344155)
          # died here with "Unable to find repository 'PSGallery'" — the
          # runner image no longer guarantees the default registration.
          # Register-PSRepository -Default restores it idempotently; a
          # healthy registration is a no-op.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          if (-not (Get-Module -ListAvailable TrustedSigning)) {
            Install-Module -Name TrustedSigning -RequiredVersion 0.5.8 -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
          }
          Import-Module TrustedSigning -Force
          Get-Command Invoke-TrustedSigning | Out-Null
          Write-Host "TrustedSigning module ready: $((Get-Module TrustedSigning).Version)"

      # Signs the leg's PE artifact in the staging dir (the verify step
      # below restores the contract path). The account input is
      # `signing-account-name` — spec 34 §5's draft
      # `trusted-signing-account-name` is the deprecated alias at this
      # action's @v1 (the PR #566 deviation, verified against the action's
      # action.yml); do not "upgrade" the action — @v2 dropped it.
      - name: Sign the runtime exe (spec 34 §8.2)
        if: steps.signgate.outputs.armed == 'true'
        uses: Azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1 (sha-pinned; proven on the ruby factory's armed windows legs + tebako dry-run 34490242097)
        with:
          endpoint: ${{ vars.AZURE_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERT_PROFILE }}
          files-folder: sign-staging
          # The enumeration gate (§7.3): everything PE signs by EXTENSION,
          # never a name list — a new PE artifact must not ship unsigned by
          # omission. Sound by construction here: the staging dir carries
          # only the exe, so the filter can miss nothing the gate below
          # would not also catch by name.
          files-folder-filter: exe,dll
          file-digest: SHA256
          # §1.4: the RFC 3161 countersignature is mandatory (the action's
          # default timestamp server; set explicitly per spec).
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: tebako julia runtime (tamatebako)

      - name: Verify the signatures (spec 34 §7.1/§7.2)
        if: steps.signgate.outputs.armed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = "tebako-runtime-${{ needs.compute.outputs.tebako_version }}-julia-${{ matrix.julia }}-${{ matrix.host_id }}"
          # §7.3: enumerate the SIGNED set by EXTENSION at the staging
          # dir, never a name list. This leg ships exactly ONE host-level
          # PE — the launcher exe (julia.exe + its DLLs live INSIDE the
          # .tfs env image — the exec-cache shape — so there is no DLL
          # facet to enumerate; the gate is exe-nonempty, never
          # dll-nonempty).
          $exes = @(Get-ChildItem -Path 'sign-staging' -Filter '*.exe' -File)
          if ($exes.Count -eq 0) {
            Write-Host "::error::spec 34 §7.3: no .exe artifact under sign-staging — the runtime exe escaped signing"
            exit 1
          }
          $stagedExe = "sign-staging/$runtime.exe"
          if (-not (Test-Path $stagedExe -PathType Leaf)) {
            Write-Host "::error::spec 34 §7.3: $stagedExe missing after the sign action — the runtime exe escaped signing"
            exit 1
          }
          # Restore the CONTRACT-named path with the signed bytes,
          # replacing the unsigned original the staging step left in
          # place — the publish upload ships exactly this name, and the
          # boot smoke + the provenance gate then exercise the signed
          # bytes. The verify loop below runs at the restored path:
          # signtool verifies content, not filename.
          $exe = "runtime-packages/$runtime.exe"
          Move-Item -Force $stagedExe $exe
          $pes = @(Get-Item $exe)
          # signtool.exe: the action's cached BuildTools first (the
          # TrustedSigning module still owns that directory name at
          # action @v1; the ArtifactSigning spelling is kept as a
          # forward-compat fallback), then the runner image's Windows
          # Kits; newest path first.
          $signtool = @(
            Get-ChildItem -Path "$env:LOCALAPPDATA\TrustedSigning\Microsoft.Windows.SDK.BuildTools" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
            Get-ChildItem -Path "$env:LOCALAPPDATA\ArtifactSigning\Microsoft.Windows.SDK.BuildTools" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
            Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue
          ) | Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            Write-Host "::error::spec 34 §7.1: signtool.exe not found (action BuildTools cache and Windows Kits both empty)"
            exit 1
          }
          Write-Host "signtool: $($signtool.FullName)"
          $failed = $false
          foreach ($pe in $pes) {
            Write-Host "== signtool verify /pa /v $($pe.Name)"
            $out = & $signtool.FullName verify /pa /v $pe.FullName 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::spec 34 §7.1: signtool verify /pa FAILED for $($pe.Name)"
              $failed = $true
              continue
            }
            # §7.2/§1.4: the RFC 3161 countersignature is mandatory — an
            # untimestamped signature fails the leg, never a warning.
            if ($out -notmatch 'signature is timestamped' -and $out -notmatch 'RFC ?3161') {
              Write-Host "::error::spec 34 §7.2: no RFC 3161 timestamp countersignature in signtool output for $($pe.Name)"
              $failed = $true
              continue
            }
            $sig = Get-AuthenticodeSignature $pe.FullName
            if ($sig.Status -ne 'Valid') {
              Write-Host "::error::spec 34 §7.1: Get-AuthenticodeSignature status '$($sig.Status)' (not Valid) for $($pe.Name)"
              $failed = $true
              continue
            }
            if ($null -eq $sig.TimeStamperCertificate) {
              Write-Host "::error::spec 34 §7.2: Get-AuthenticodeSignature reports no TimeStamperCertificate for $($pe.Name)"
              $failed = $true
              continue
            }
            Write-Host "signed+timestamped: $($pe.Name) — $($sig.SignerCertificate.Subject)"
          }
          if ($failed) { exit 1 }
          # Sign-then-hash (§1.3): the build emitted the exe's .sha256
          # sidecar over the PRE-SIGN bytes, so re-anchor it to the
          # SIGNED bytes — the provenance gate's sidecar arm and the
          # publish stage anchor exactly the shipped bytes (the macOS
          # arm's idiom; the store trust-anchor grammar is
          # "<sha256>  <filename>\n").
          $exeFull = (Resolve-Path $exe).Path
          $signedSha = (Get-FileHash -Algorithm SHA256 $exeFull).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$exeFull.sha256", "$signedSha  $(Split-Path $exe -Leaf)`n")
          Write-Host "sidecar re-anchored to the signed bytes: $signedSha  $(Split-Path $exe -Leaf)"

      # --- the gates (a red gate skips the publish below, and the
      # release job's audit then fails the run loudly) ------------------
      - name: Check the pair's provenance (container legs)
        if: matrix.container != null
        env:
          CONTAINER_DIGESTS: ${{ needs.compute.outputs.container_digests }}
        run: |
          set -euo pipefail
          c="${{ matrix.container }}"
          name="${c%:*}"
          case "${{ matrix.arch }}" in
            x86_64) carch=amd64 ;;
            arm64)  carch=arm64 ;;
            *) echo "::error::unknown leg arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          digest=$(printf '%s' "$CONTAINER_DIGESTS" | jq -r --arg c "${name#ghcr.io/tamatebako/}" --arg a "$carch" '.[$c][$a] // empty')
          [ -n "$digest" ] || { echo "::error::no recorded container digest for $name/$carch"; exit 1; }
          docker run --rm -v "${{ github.workspace }}:/mnt/w" -w /mnt/w \
            "${c}@${digest}" bash -c '
              set -euo pipefail
              stem="runtime-packages/tebako-runtime-${{ needs.compute.outputs.tebako_version }}-julia-${{ matrix.julia }}-${{ matrix.host_id }}"
              ci/check_pair_provenance.sh --exe "$stem" --card "$stem.contract.yaml" \
                --tfs "$(echo .build/downloads/tfs/*/tfs-*)" --image "$stem.tfs"'

      # The Mach-O arm of the gate keys off APPLE_SIGNING_ENABLED (the
      # unsigned path stays first-class; armed, it asserts the signature
      # chain + the entitlement pair + the ticket's visibility).
      - name: Check the pair's provenance (macos)
        if: matrix.os == 'macos'
        env:
          APPLE_SIGNING_ENABLED: ${{ vars.APPLE_SIGNING_ENABLED }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          stem="runtime-packages/tebako-runtime-${{ needs.compute.outputs.tebako_version }}-julia-${{ matrix.julia }}-${{ matrix.host_id }}"
          ci/check_pair_provenance.sh --exe "$stem" --card "$stem.contract.yaml" \
            --tfs "$(echo .build/downloads/tfs/*/tfs-*)" --image "$stem.tfs"

      # Git-bash: the gate's tfs calls are native exes — the gate itself
      # wraps them with MSYS2_ARG_CONV_EXCL + cygpath (its header). The
      # PE arm keys off WINDOWS_SIGNING_ENABLED (the unsigned path stays
      # first-class; armed, it anchors the SIGNED bytes + a Valid
      # timestamped Authenticode signature — the Mach-O arm's mirror).
      - name: Check the pair's provenance (windows)
        if: matrix.os == 'windows'
        shell: bash
        env:
          WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
        run: |
          set -euo pipefail
          stem="runtime-packages/tebako-runtime-${{ needs.compute.outputs.tebako_version }}-julia-${{ matrix.julia }}-${{ matrix.host_id }}"
          ci/check_pair_provenance.sh --exe "$stem.exe" --card "$stem.contract.yaml" \
            --tfs "$(echo .build/downloads/tfs/*/tfs-*)" --image "$stem.tfs"

      # The boot smoke resolves the exe from TEBAKO_RUNTIME_ROOT.
      # TEBAKO_TFS names the tfs CLI the build fetched (the payload
      # scenario's fixture image packs with it) — inside the container
      # legs it is the gnu binary matching the image.
      - name: Boot smoke (container legs)
        if: matrix.container != null
        env:
          CONTAINER_DIGESTS: ${{ needs.compute.outputs.container_digests }}
        run: |
          set -euo pipefail
          c="${{ matrix.container }}"
          name="${c%:*}"
          case "${{ matrix.arch }}" in
            x86_64) carch=amd64 ;;
            arm64)  carch=arm64 ;;
            *) echo "::error::unknown leg arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          digest=$(printf '%s' "$CONTAINER_DIGESTS" | jq -r --arg c "${name#ghcr.io/tamatebako/}" --arg a "$carch" '.[$c][$a] // empty')
          [ -n "$digest" ] || { echo "::error::no recorded container digest for $name/$carch"; exit 1; }
          docker run --rm -v "${{ github.workspace }}:/mnt/w" -w /mnt/w \
            "${c}@${digest}" bash -c '
              set -euo pipefail
              export TEBAKO_RUNTIME_ROOT=runtime-packages
              TEBAKO_TFS=$(echo .build/downloads/tfs/*/tfs-*)
              export TEBAKO_TFS
              tools/boot_smoke'

      - name: Boot smoke (macos)
        if: matrix.os == 'macos'
        env:
          TEBAKO_RUNTIME_ROOT: runtime-packages
        run: |
          set -euo pipefail
          TEBAKO_TFS=$(echo .build/downloads/tfs/*/tfs-*)
          export TEBAKO_TFS
          tools/boot_smoke

      - name: Boot smoke (windows)
        if: matrix.os == 'windows'
        shell: bash
        env:
          TEBAKO_RUNTIME_ROOT: runtime-packages
        run: |
          set -euo pipefail
          TEBAKO_TFS=$(echo .build/downloads/tfs/*/tfs-*)
          export TEBAKO_TFS
          tools/boot_smoke

      # The leg-complete marker (tebako-runtime-ruby#190): written only
      # when every gate above passed — a failed step stops the job before
      # this point (default step gating). The diagnostics upload below is
      # always(), so a red leg's partial packages DO ship as an artifact;
      # the publish job refuses any artifact without this marker.
      - name: Mark the leg complete
        shell: bash
        run: touch runtime-packages/.leg-complete

      # The leg's workspace, kept for a day as build diagnostics AND as
      # the publish job's input (tebako-runtime-ruby#190's split): one
      # artifact per (platform, arch, julia) leg, immutable across the
      # run's attempts — a re-run publish leg re-downloads exactly these
      # bytes. Uploads even when the build or boot smoke failed
      # (always()) — a red leg's packages are exactly the ones worth
      # diagnosing; the .leg-complete marker above is what keeps them
      # unpublished.
      - name: Upload the runtime packages
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-packages-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.julia }}
          # include-hidden-files: the .leg-complete marker is dot-hidden
          # (upload-artifact excludes dotfiles by default since v4.4) and
          # IS the publish job's completeness gate.
          include-hidden-files: true
          path: runtime-packages
          retention-days: 1

      # The build log is the leg's fetch/stage/pack evidence — the step
      # log interleaves the shell wrapper, so the leg's own answers live
      # here. Retained a week (text, near-free), not the packages' 1d.
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.julia }}
          path: .build/build.log
          if-no-files-found: warn
          retention-days: 7

  # Spec 13 §2a (the de-rendezvous, tebako-runtime-ruby#161's pattern) as
  # its OWN job (tebako-runtime-ruby#190): the leg that built a package
  # publishes it — payload assets + .sha256 sidecars + the .manifest.json
  # shard, write-once names this leg owns alone — and then signs every
  # served name (spec 09 §5's no-fold rule). No shared file exists, so N
  # legs publish concurrently with zero rendezvous. The split is the
  # recovery story: GitHub's re-run granularity is the job, so a
  # publish-layer failure re-runs as a minutes-long download + upload of
  # the immutable in-run artifact — never a rebuild (the 2026-09-23
  # wedge cost a full-catalog rebuild before this job existed).
  publish:
    name: publish ${{ matrix.julia }} / ${{ matrix.os }}-${{ matrix.arch }}
    needs: [compute, build]
    # always(): one failed build leg must not skip the GREEN legs'
    # publishes — the de-rendezvous holds across jobs. A leg whose build
    # failed ships no complete artifact; its publish leg fails named at
    # the guards below.
    if: ${{ always() && !cancelled() && needs.compute.outputs.run == 'true' && inputs.publish && !inputs.audit }}
    # attestations/id-token: the SLSA L3 provenance arm at the leg tail
    # (gated with the publish — the job's own if — so build/audit runs
    # never attest).
    permissions:
      contents: write
      attestations: write
      id-token: write
    # Runner-native on ubuntu-latest for every leg: the uploader is pure
    # API work, and the signer auto-detects THIS host's tebako-pkg
    # (linux-gnu-x86_64) — an OpenPGP detached signature over served bytes
    # is host-independent.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute.outputs.legs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the leg's runtime packages
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-packages-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.julia }}
          path: runtime-packages

      - name: Guard the artifact's completeness
        run: |
          set -euo pipefail
          if [ "${{ steps.download.outcome }}" != "success" ]; then
            echo "::error::no runtime-packages artifact for this leg — its build leg did not complete"
            echo "(a loudly-skipped or failed build publishes nothing; fix the build leg, then re-run failed jobs)"
            exit 1
          fi
          if [ ! -f runtime-packages/.leg-complete ]; then
            echo "::error::the leg's artifact carries no .leg-complete marker — the build leg died before its gates passed; these partial bytes are not publishable"
            exit 1
          fi

      - name: Setup Ruby (the release tooling)
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Publish the leg's runtime package (spec 13 §2a)
        shell: bash
        env:
          # The job-level runner GITHUB_TOKEN authenticates the release
          # API calls (see publish.yml's header).
          TEBAKO_VERSION: ${{ needs.compute.outputs.tebako_version }}
          EXPECTED_ENV_MATRIX: '[{"os":"${{ matrix.os }}","arch":"${{ matrix.arch }}"}]'
          EXPECTED_JULIA_MATRIX: '["${{ matrix.julia }}"]'
          TEBAKO_RELEASE_SIGNING_ENABLED: ${{ vars.TEBAKO_RELEASE_SIGNING_ENABLED }}
          TEBAKO_RELEASE_SIGNING_KEYID: ${{ vars.TEBAKO_RELEASE_SIGNING_KEYID }}
        run: |
          set -euo pipefail
          bundle exec tebako-release upload

      - name: Sign the leg's release assets (spec 09 §5)
        shell: bash
        env:
          TEBAKO_VERSION: ${{ needs.compute.outputs.tebako_version }}
          TEBAKO_RELEASE_SIGNING_ENABLED: ${{ vars.TEBAKO_RELEASE_SIGNING_ENABLED }}
          TEBAKO_RELEASE_SIGNING_KEY: ${{ secrets.TEBAKO_RELEASE_SIGNING_KEY }}
          SIGN_ONLY_STEMS: tebako-runtime-${{ needs.compute.outputs.tebako_version }}-julia-${{ matrix.julia }}-${{ matrix.host_id }}
        run: bundle exec tebako-release sign

      # SLSA L3 provenance over the exact bytes this leg ships — the staged
      # runtime package + its .sha256 sidecars + the .manifest.json shard
      # (plus the detached .asc when the signing arm ran: the signer
      # converges them into this same dir). The .leg-complete marker is
      # dot-hidden, so the glob never names it. Gated with the publish
      # above (the job's own if) — build/audit runs never attest.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: runtime-packages/*

  # The terminal aggregate — and the branch-protection gate. The build
  # legs are a dynamic matrix whose check names shift with the catalog
  # (a version bump renames every leg), so protection pins this job's
  # stable per-platform check name ("<platform> / all legs green")
  # instead of any leg's. Green means: the contract/matrix computed, the
  # container pins proved, every emitted leg succeeded, and — on publish
  # runs — every publish leg landed (tebako-runtime-ruby#190: the gate
  # depends on the publish jobs, not only the builds); a platform whose
  # filter emits no legs gates on compute alone. Audit runs (publish.yml's
  # audit mode) build nothing and skip this job.
  verify:
    name: all legs green
    needs: [parity, compute, preflight, build, publish]
    if: ${{ always() && !cancelled() && !inputs.audit }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the legs
        run: |
          set -euo pipefail
          echo "parity:    ${{ needs.parity.result }}"
          echo "compute:   ${{ needs.compute.result }} (run=${{ needs.compute.outputs.run }}, legs=${{ needs.compute.outputs.leg_count }})"
          echo "preflight: ${{ needs.preflight.result }}"
          echo "build:     ${{ needs.build.result }}"
          echo "publish:   ${{ needs.publish.result }} (requested=${{ inputs.publish }})"
          if [ "${{ needs.compute.result }}" != "success" ]; then
            echo "::error::the contract/matrix computation failed"
            exit 1
          fi
          if [ "${{ needs.compute.outputs.run }}" = "true" ] && [ "${{ needs.preflight.result }}" != "success" ]; then
            echo "::error::the container preflight failed: ${{ needs.preflight.result }}"
            exit 1
          fi
          if [ "${{ needs.compute.outputs.run }}" = "true" ] && [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::not every ${{ inputs.platform }} leg succeeded: ${{ needs.build.result }}"
            exit 1
          fi
          # A publish-requested run gates on the publish legs too (the job
          # is skipped outright when publish was not requested — that is
          # the success() semantics for a non-publish run).
          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ needs.compute.outputs.run }}" = "true" ] && [ "${{ needs.publish.result }}" != "success" ]; then
            echo "::error::not every ${{ inputs.platform }} publish leg succeeded: ${{ needs.publish.result }}"
            exit 1
          fi
